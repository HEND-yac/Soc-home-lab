version : "3.8"

services:
  cassandra:
    image: cassandra:4.1.11
    container_name: cassandra
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
      - CASSANDRA_CLUSTER_NAME=thp
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - hive_net
    deploy:
      ressources:
        limits:
          cpus: '0.50'
          mempry: 1G

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.15
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
      - bootstrap.memory_lock=false
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - hive_net
    deploy:
      ressources:
        limits:
          cpus: '0.50'
          memory: 2G
  thehive:
    image: strangebee/thehive:5.2
    container_name: thehive
    depends_on:
      - cassandra
      - elasticsearch
    ports:
      - "9000:9000"
    environment:
      -JVM_OPTS=-Xms512m -Xmx512m
    command:
      - --cql-hostnames
      - cassandra
      - --index-backend
      - elasticsearch
      - --es-hostnames
      - elasticsearch
    volumes:
      - thehive_data:/data/files
    networks:
      - hive_net
    deploy:
      ressources:
        limits:
          cpus: '0.50'
          memory: 1G

 networks:
    hive_net:
      driver: bridge

 volumes:
   cassandra_data:
   es_data:
   thehive_data: